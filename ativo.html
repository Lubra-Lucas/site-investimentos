<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ativo · Carteira Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preload" as="fetch" crossorigin href="data/radar.json">
  <link rel="preload" as="fetch" crossorigin href="data/setups.json">
  <script defer src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="pagina-ativo">
    <section class="painel cab-ativo">
      <div class="cab-ativo-busca">
        <button class="botao-seta" id="ativo-anterior" title="Ativo anterior (←)" aria-label="Ativo anterior">‹</button>
        <input id="f-ativo" type="search" list="lista-tickers" spellcheck="false" autocomplete="off"
          placeholder="Trocar de ativo: PETR4, NVDA, BTC" aria-label="Trocar de ativo">
        <datalist id="lista-tickers"></datalist>
        <button class="botao-seta" id="ativo-seguinte" title="Ativo seguinte (→)" aria-label="Ativo seguinte">›</button>
      </div>
      <div class="cab-ativo-id" id="cab-ativo-id"></div>
      <div class="cab-ativo-links" id="cab-ativo-links"></div>
    </section>

    <section class="area-ativo">
      <div class="painel painel-grafico" id="painel-grafico"></div>
      <aside class="painel ficha-lateral" aria-label="Setups e contexto do ativo">
        <ul class="lista-ativos ficha" id="ficha-lateral"></ul>
      </aside>
    </section>

    <section class="grade-ativo">
      <div class="painel" id="bloco-historico"></div>
      <div class="painel" id="bloco-panorama"></div>
    </section>
  </main>

  <footer>
    Uso pessoal. Os setups são filtros técnicos automáticos, não recomendação de investimento.
    Dados: Yahoo Finance, conferidos com B3 (COTAHIST e cotações), Nasdaq (EUA) e Coinbase (cripto).
  </footer>

  <script defer src="assets/js/comum.js"></script>
  <script defer src="assets/js/desenhos.js"></script>
  <script defer src="assets/js/simulador.js"></script>
  <script defer src="assets/js/rastreador.js"></script>
  <script defer src="assets/js/eventos.js"></script>
  <script defer src="assets/js/plano.js"></script>
  <script defer src="assets/js/diario-dados.js"></script>
  <script defer src="assets/js/notas.js"></script>
  <script defer src="assets/js/comparar.js"></script>
  <script defer src="assets/js/arrastar.js"></script>
  <script defer src="assets/js/ativo.js"></script>
</body>
</html>
