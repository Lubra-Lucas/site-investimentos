name: Telegram (3 posts por dia)

# Publica no canal: 1) sinais do dia (Top do dia + post do dia), 2) educativo, 3) como terminou.
# Roda depois de cada publicação do site (os dados já estão no ar) e a cada 2 horas, das 8h às 22h de
# Brasília, para espaçar os posts. Cada post sai uma vez só: o estado fica na branch estado-telegram.

on:
  workflow_run:
    workflows: ["Atualizar dados e publicar"]
    types: [completed]
  schedule:
    - cron: "41 11-23/2 * * *"
    - cron: "41 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  postar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Ler o estado (branch estado-telegram)
        run: |
          mkdir -p data/conteudo
          if git fetch --depth=1 origin estado-telegram; then
            git show FETCH_HEAD:telegram.json > data/conteudo/telegram.json
          else
            echo "Sem branch de estado ainda: o script usa a cópia publicada no site."
          fi

      - name: Publicar
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM: ${{ secrets.TELEGRAM }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/telegram_postar.py

      - name: Gravar o estado
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          test -f data/conteudo/telegram.json || exit 0
          E="$RUNNER_TEMP/estado"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 20 --branch estado-telegram "$URL" "$E" 2>/dev/null; then
            git init -q -b estado-telegram "$E"
            git -C "$E" remote add origin "$URL"
          fi
          cp data/conteudo/telegram.json "$E/"
          cp data/conteudo/telegram-status.json "$E/" 2>/dev/null || true
          cd "$E"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "estado sem mudança"; exit 0; fi
          git commit -q -m "Estado do Telegram $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:estado-telegram
