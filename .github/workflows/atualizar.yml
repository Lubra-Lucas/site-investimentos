name: Atualizar dados e publicar

on:
  schedule:
    # 22:30 UTC = 19:30 em Brasília. O fechamento oficial da B3 só aparece no Yahoo
    # por volta das 18:30; com folga, o candle do dia já vem consolidado.
    # Roda também no fim de semana para pegar o candle diário das criptos.
    - cron: "30 22 * * *"
    # 10:17 UTC = 07:17 em Brasília: o COTAHIST oficial da B3 do pregão anterior já está
    # publicado e completa qualquer candle que tenha vindo quebrado do Yahoo na rodada da noite.
    - cron: "17 10 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar cotações, verificar e calcular sinais
        env:
          # Opcional: token gratuito de https://brapi.dev para conferir os fechamentos da B3
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          # mostra cada etapa (com o tempo) no log na hora, em vez de tudo no fim
          PYTHONUNBUFFERED: "1"
        run: python scripts/atualizar_dados.py

      - name: Conteúdo para redes (posts, legenda e newsletter)
        # Opcional: se nada qualificar (ou der erro), grava hoje.json com vazio e o build segue.
        continue-on-error: true
        run: python scripts/conteudo.py

      - name: Top do dia (ranking.json)
        # Opcional: sem ele a página Top do dia mostra aviso e o Telegram não posta o ranking.
        continue-on-error: true
        run: python scripts/ranking.py

      - name: Histórico dos sinais (resultados.json)
        # Opcional: sem ele a página Histórico dos sinais mostra aviso e o build segue.
        continue-on-error: true
        run: python scripts/resultados.py

      - name: Publicar no Telegram (post do dia e resumos semanais)
        # Sem os segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID não faz nada; não repete data nem semana.
        # Vem depois de resultados.py, que alimenta o "Como terminaram os sinais".
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # também aceita um segredo único TELEGRAM com as linhas TELEGRAM_BOT_TOKEN=... e TELEGRAM_CHAT_ID=...
          TELEGRAM: ${{ secrets.TELEGRAM }}
        run: python scripts/telegram_postar.py

      - name: Páginas públicas por ativo (ativos/, sitemap.xml, robots.txt)
        # Opcional: páginas estáticas para o Google; sem elas o site segue igual.
        continue-on-error: true
        run: python scripts/paginas_ativos.py

      - name: Montar site
        run: |
          mkdir _site
          # todas as páginas da raiz (Carteira, Setups, Ativo, Backtest e os redirecionamentos antigos)
          cp -r *.html manifest.webmanifest assets data _site/
          cp -r ativos sitemap.xml robots.txt _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # o GitHub Pages às vezes demora para sincronizar; o padrão (10 min) já estourou
          timeout: 1800000
